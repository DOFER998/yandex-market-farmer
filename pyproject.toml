[project]
name = "yandex-market-farmer"
version = "0.1.0"
description = "Conservative Yandex Market rewards client"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["curl-cffi==0.16.3", "pydantic>=2.12,<3", "pydantic-settings>=2.12,<3"]

[project.scripts]
ymf = "yandex_market_farmer.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
