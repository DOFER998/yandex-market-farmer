name: ymf-local
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES__DATABASE:-ymf}"
      POSTGRES_USER: "${POSTGRES__USER:-ymf}"
      POSTGRES_PASSWORD: "${POSTGRES__PASSWORD:?Run make setup-env}"
    ports:
      - "127.0.0.1:${POSTGRES__PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
