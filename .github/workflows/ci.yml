name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: ymf
          POSTGRES_USER: ymf
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ymf -d ymf"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --locked --all-extras
      - run: make check
      - name: Check Bash installer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          bash -n scripts/install.sh
          shellcheck scripts/install.sh
      - name: Real PostgreSQL integration
        env:
          BOT__TOKEN: '123456:ci-placeholder'
          BOT__OWNER_ID: '123'
          POSTGRES__HOST: 127.0.0.1
          POSTGRES__PORT: '5432'
          POSTGRES__USER: ymf
          POSTGRES__PASSWORD: ci-only-password
          POSTGRES__DATABASE: ymf
          YMF_TEST_POSTGRES: '1'
        run: uv run --no-sync pytest -q tests/test_postgres.py
      - name: Validate Compose without production secrets
        run: |
          cp .env.example .env
          docker compose -f docker-compose.local.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml config --format json | jq -e '
            [.services.bot.tmpfs, .services.migrate.tmpfs] |
            all(. == ["/tmp:rw,noexec,nosuid,size=64m"])
          '
          docker compose -f docker-compose.prod.yml -f docker-compose.build.yml config --quiet

  image:
    name: Docker smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ymf:ci
      - name: Import runtime and generate QR inside read-only image
        run: |
          docker run --rm --read-only --network none --tmpfs /tmp ymf:ci python -c '
          import os
          import importlib.util
          import src.main
          import curl_cffi
          import asyncpg
          from pydantic import SecretStr
          from src.common.utils.qr import qr_png
          assert os.getuid() != 0
          assert importlib.util.find_spec("playwright") is None
          assert qr_png(SecretStr("https://passport.yandex.ru/ci")).startswith(bytes.fromhex("89504e47"))
          '
          docker run --rm --network none ymf:ci alembic heads
      - name: Production Compose mounts, migrations and healthcheck
        run: bash scripts/smoke_compose.sh ymf:ci
